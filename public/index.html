<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEE AI Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <header class="border-b border-slate-800 p-4 bg-slate-900">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">JEE AI Academy 🚀</h1>
      <span class="text-xs bg-blue-900/50 text-blue-300 px-3 py-1 rounded-full border border-blue-700/50">Groq GPT-OSS Powered</span>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col gap-4">
    <div id="chat-box" class="flex-1 bg-slate-900/50 border border-slate-800 rounded-xl p-4 overflow-y-auto space-y-4 max-h-[60vh] min-h-[50vh]">
      <div class="bg-slate-800/80 p-3 rounded-lg max-w-[80%] border border-slate-700">
        <p class="text-sm">Namaste Captain! Main aapka JEE AI Teacher hoon. Aaj hum kaun sa chapter shuru karein? (Jaise: Fluid Mechanics, Rotational Motion, etc.)</p>
      </div>
    </div>

    <div class="flex gap-2">
      <input id="user-input" type="text" placeholder="Apna doubt ya chapter ka naam likho..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500">
      <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-xl font-medium text-sm transition">Ask AI</button>
    </div>
  </main>

  <script>
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const text = input.value.trim();
      if (!text) return;

      // User message
      chatBox.innerHTML += `<div class="flex justify-end"><div class="bg-blue-600 p-3 rounded-lg max-w-[80%] text-sm">${text}</div></div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // Loading placeholder
      const loadingId = 'load-' + Date.now();
      chatBox.innerHTML += `<div id="${loadingId}" class="bg-slate-800/80 p-3 rounded-lg max-w-[80%] border border-slate-700 text-sm text-slate-400">Thinking...</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        
        document.getElementById(loadingId).remove();
        chatBox.innerHTML += `<div class="bg-slate-800/80 p-3 rounded-lg max-w-[80%] border border-slate-700 text-sm">${data.reply.replace(/\n/g, '<br>')}</div>`;
      } catch (err) {
        document.getElementById(loadingId).innerText = "Error getting response.";
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
